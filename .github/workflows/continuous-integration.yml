name: Liveblog CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CI: true
  SYNDICATION_VALIDATE_AUTH: 0
  MAIL_SERVER: 'localhost'
  MAIL_PORT: 2225
  MAIL_USERNAME: __EMPTY__
  MAIL_PASSWORD: __EMPTY__
  MAIL_USE_TLS: 0
  MAIL_USE_SSL: 0
  MAIL_DEBUG: 1
  MAIL_SUPPRESS_SEND: true
  IFRAMELY_KEY: ${{ secrets.IFRAMELY_KEY }}
  SUPERDESK_URL: 'http://localhost:5000/api'
  SUPERDESK_WS_URL: 'ws://localhost:5100'
  SUPERDESK_CLIENT_URL: 'http://localhost:9000'
  WEB_CONCURRENCY: 3
  WEB_TIMEOUT: 8
  SUPERDESK_TESTING: true
  MARKETPLACE: true
  SYNDICATION: true
  # The lowest cost bcrypt accepts. Every e2e test reseeds the users and logs
  # in, so hashing at the production cost takes about half of the suite's time.
  BCRYPT_GENSALT_WORK_FACTOR: 4

jobs:
  server:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: pytest
            command: pytest --ignore=src/ --disable-pytest-warnings -v
          - suite: behave
            command: behave --format progress2 --logging-level ERROR

    services:
      mongodb:
        image: mongo:3.4.23
        ports:
          - 27017:27017
      redis:
        image: redis
        ports:
          - 6379:6379
      elasticsearch:
        image: liveblog3/elasticsearch:1.7.2
        ports:
          - 9200:9200

    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-server

    - name: Run ${{ matrix.suite }}
      working-directory: ./server
      run: ${{ matrix.command }}

  client-lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-client

    - name: Lint client
      working-directory: ./client
      shell: bash
      run: npm run lint

  e2e:
    name: e2e (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-24.04

    # Each shard is its own job with its own databases: every test wipes and
    # reseeds them, so the specs cannot share a backend across parallel workers.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    services:
      mongodb:
        image: mongo:3.4.23
        ports:
          - 27017:27017
      redis:
        image: redis
        ports:
          - 6379:6379
      elasticsearch:
        image: liveblog3/elasticsearch:1.7.2
        ports:
          - 9200:9200

    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-server

    - uses: ./.github/actions/setup-client

    - uses: ./.github/actions/start-app

    - name: Setup Node 24 for Playwright
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install Playwright dependencies
      working-directory: ./client/e2e
      shell: bash
      run: |
        npm ci
        npx playwright install chromium --with-deps

    - name: Run Playwright e2e tests
      working-directory: ./client/e2e
      shell: bash
      run: npx playwright test --reporter=line --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
