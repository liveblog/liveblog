name: Liveblog CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      CI: true
      SYNDICATION_VALIDATE_AUTH: 0
      MAIL_SERVER: 'localhost'
      MAIL_PORT: 2225
      MAIL_USERNAME: __EMPTY__
      MAIL_PASSWORD: __EMPTY__
      MAIL_USE_TLS: 0
      MAIL_USE_SSL: 0
      MAIL_DEBUG: 1
      MAIL_SUPPRESS_SEND: true
      IFRAMELY_KEY: ${{ secrets.IFRAMELY_KEY }}
      SUPERDESK_URL: 'http://localhost:5000/api'
      SUPERDESK_WS_URL: 'ws://localhost:5100'
      SUPERDESK_CLIENT_URL: 'http://localhost:9000'
      WEB_CONCURRENCY: 3
      WEB_TIMEOUT: 8
      SUPERDESK_TESTING: true
      MARKETPLACE: true
      SYNDICATION: true

    services:
      mongodb:
        image: mongo:3.4.23
        ports:
          - 27017:27017
      redis:
        image: redis
        ports:
          - 6379:6379
      elasticsearch:
        image: liveblog3/elasticsearch:1.7.2
        ports:
          - 9200:9200

    steps:
    - uses: actions/checkout@v5

    - name: Set up server
      uses: ./.github/actions/setup-server

    - name: Run Python tests
      working-directory: ./server
      run: |
        pytest --ignore=src/ --disable-pytest-warnings -v
        behave --format progress2 --logging-level ERROR

    - name: Set up client
      uses: ./.github/actions/setup-client

    - name: Lint client
      working-directory: ./client
      shell: bash
      run: npm run lint

    - name: Start app
      uses: ./.github/actions/start-app

    - name: Setup Node 24 for Playwright
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install Playwright dependencies
      working-directory: ./client/e2e
      shell: bash
      run: |
        npm ci
        npx playwright install chromium --with-deps

    - name: Run Playwright e2e tests
      working-directory: ./client/e2e
      shell: bash
      run: npx playwright test --reporter=line
