name: "Lint"

on: [push, pull_request]

jobs:
  black:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: psf/black@stable
        with:
          options: "--check"
          src: "./server"
          version: "~= 22.0"

  flake8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Install flake8
        run: |
          pip install flake8
      - name: Run flake8
        run: |
          flake8 --config=./server/setup.cfg server/